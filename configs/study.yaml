datasets:
- s1gfloods
- ombrias1
seeds:
- 23534
primary_variants:
- parallel
- no_temporal
- attention_only
- memory_only
threshold_grid:
  start: 0.05
  stop: 0.95
  step: 0.01
model:
  encoder: efficientnetv2_rw_t
  pretrained: true
  hidden_dim: 64
  lstm_hidden: 128
  dropout: 0.1
loss:
  name: tversky
  alpha: 0.3
  beta: 0.7
  smooth: 1.0
data:
  image_size: 256
  batch_size: 16
  num_workers: 4
  random_exchange: false
training:
  max_steps: 40000
  learning_rate: 0.0005
  warmup_steps: 200
  betas:
  - 0.9
  - 0.99
  epsilon: 1.0e-08
  weight_decay: 0.0001
